spring:
  application:
    name: jutjubic-gateway
  cloud:
    loadbalancer:
      sticky-session:
        add-service-instance-cookie: true
    gateway:
      routes:
        - id: websocket-route
          uri: lb:ws://jutjubic-backend
          predicates:
            - Path=/ws/**
          filters:
            - RemoveRequestHeader=Origin
            - RewritePath=/ws/(?<segment>.*), /ws/$\{segment}
        - id: backend-route
          uri: lb://jutjubic-backend
          predicates:
            - Path=/api/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: ["http://localhost:4200", "http://127.0.0.1:4200"]
            allowedHeaders: "*"
            allowedMethods: "*"
            allowCredentials: true
            maxAge: 3600
      httpclient:
        websocket:
          max-frame-payload-length: 65536

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${HOSTNAME}
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10
    hostname: ${HOSTNAME}
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka}
    registry-fetch-interval-seconds: 5
    register-with-eureka: true
    fetch-registry: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty.http.client: DEBUG