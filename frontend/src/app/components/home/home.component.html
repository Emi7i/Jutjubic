<div class="home-container">
  <div class="hero-section">
    <div class="hero-content">
      <h1 class="hero-title">Jutjubić</h1>
      <p class="hero-subtitle">Your video sharing platform without ads</p>

      <div class="button-group">
        <button class="cta-button primary" (click)="goToVideos()">
          Explore Videos
        </button>
        <button class="cta-button secondary" (click)="goToLogin()">
          Login
        </button>
        <button class="cta-button secondary" (click)="goToRegister()">
          Register
        </button>
        <button class="cta-button secondary" (click)="goToMap()">
          Map
        </button>
        <button class="cta-button upload" (click)="goToUpload()">
          Upload Video
        </button>
      </div>
    </div>
  </div>

  <!-- Popular Videos Section -->
  <div class="popular-videos-section" style="background: white;">
    <div class="container">
      <div *ngIf="popularVideos.length === 0" class="no-videos">
        <p>No popular videos yet. Check back later!</p>
      </div>
      <div *ngIf="popularVideos.length > 0" class="carousel">
        <button class="carousel-btn prev" (click)="prevVideo()" *ngIf="popularVideos.length > 1">&lt;</button>
        <div class="video-display">
          <img [ngClass]="{'animating': animating}" [src]="popularVideos[currentIndex].thumbnailUrl" [alt]="popularVideos[currentIndex].title" class="video-thumbnail" (click)="goToVideo(popularVideos[currentIndex].id)">
          <h3>{{ popularVideos[currentIndex].title }}</h3>
        </div>
        <button class="carousel-btn next" (click)="nextVideo()" *ngIf="popularVideos.length > 1">&gt;</button>
      </div>
    </div>
  </div>
</div>
