server:
  port: 8761

spring:
  application:
    name: eureka-server

eureka:
  instance:
    hostname: localhost
  client:
    # Don't register the server with itself
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
  server:
    # Enable self-preservation mode
    enable-self-preservation: true
    # Wait time before removing instances from registry
    eviction-interval-timer-in-ms: 5000
    # Renewal threshold update interval
    renewal-threshold-update-interval-ms: 30000

logging:
  level:
    com.netflix.eureka: DEBUG
    com.netflix.discovery: DEBUG
