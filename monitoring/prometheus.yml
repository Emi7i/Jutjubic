global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: 'jutjubic-backend'
    scrape_interval: 5s
    dns_sd_configs:
      - names:
          - 'backend'
        type: 'A'
        port: 8080
    metrics_path: '/actuator/prometheus'

  - job_name: 'jutjubic-gateway'
    scrape_interval: 5s
    static_configs:
      - targets: ['gateway:8080']
    metrics_path: '/actuator/prometheus'
