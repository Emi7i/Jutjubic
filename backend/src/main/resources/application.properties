# Server Configuration
server.port=8080

# Frontend url
app.frontend.url=http://localhost:4200

# SpringDoc OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Hibernate L2 Cache Configuration with Caffeine
spring.jpa.properties.hibernate.cache.use_second_level_cache=true
spring.jpa.properties.hibernate.cache.use_query_cache=true
spring.jpa.properties.hibernate.cache.region.factory_class=org.hibernate.cache.jcache.JCacheRegionFactory
spring.jpa.properties.hibernate.javax.cache.provider=com.github.benmanes.caffeine.jcache.spi.CaffeineCachingProvider
spring.jpa.properties.hibernate.cache.use_reference_entries=false
spring.jpa.properties.hibernate.generate_statistics=true

# Logging
logging.level.org.springframework=INFO
logging.level.com.example=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.cache=DEBUG
logging.level.org.hibernate.stat=DEBUG

# Validation
spring.web.resources.add-mappings=false

# DevTools
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# Email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=lubendoshop@gmail.com
spring.mail.password=evfcfsthysmctmom
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.from=lubendoshop@gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# File Upload Configuration
app.upload.dir=./uploads
app.upload.video.max-size-mb=200
app.upload.timeout-minutes=30

# Spring Boot File Upload Limits
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/jutjubic_db
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=jutjubic_user
spring.datasource.password=banana
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Redis Configuration for Distributed Rate Limiting
spring.redis.host=${SPRING_REDIS_HOST:localhost}
spring.redis.port=${SPRING_REDIS_PORT:6379}
spring.redis.timeout=2000ms
spring.redis.lettuce.pool.max-active=8
spring.redis.lettuce.pool.max-idle=8
spring.redis.lettuce.pool.min-idle=0
spring.redis.lettuce.pool.max-wait=-1ms

# Rate Limiting Configuration
app.rate-limit.sliding-window.enabled=true
app.rate-limit.sliding-window.video-upload.max-requests=10
app.rate-limit.sliding-window.video-upload.window-minutes=1
app.rate-limit.sliding-window.video-search.max-requests=100
app.rate-limit.sliding-window.video-search.window-minutes=1
app.rate-limit.sliding-window.video-view.max-requests=50
app.rate-limit.sliding-window.video-view.window-minutes=1
app.rate-limit.sliding-window.video-like.max-requests=20
app.rate-limit.sliding-window.video-like.window-minutes=1
app.rate-limit.sliding-window.general-api.max-requests=100
app.rate-limit.sliding-window.general-api.window-minutes=1