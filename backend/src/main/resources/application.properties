# Server Configuration
server.port=${SERVER_PORT:8080}

# Frontend url
app.frontend.url=http://localhost:4200

# SpringDoc OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

## Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/jutjubic_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:jutjubic_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:banana}

# JPA/Hibernate
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Hibernate L2 Cache Configuration with Caffeine
spring.jpa.properties.hibernate.cache.use_second_level_cache=true
spring.jpa.properties.hibernate.cache.use_query_cache=true
spring.jpa.properties.hibernate.cache.region.factory_class=org.hibernate.cache.jcache.JCacheRegionFactory
spring.jpa.properties.hibernate.javax.cache.provider=com.github.benmanes.caffeine.jcache.spi.CaffeineCachingProvider
spring.jpa.properties.hibernate.cache.use_reference_entries=false
spring.jpa.properties.hibernate.generate_statistics=true

# Logging
